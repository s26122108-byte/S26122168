<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入外部樣式檔案 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入社群圖示庫 (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 卡片主體 -->
    <div class="profile-card">
        <!-- 頂部裝飾背景照片/顏色 -->
        <div class="card-header"></div>
        
        <!-- 卡片主要內容區 -->
        <div class="card-body">
            <!-- 大頭貼 -->
            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="個人頭像" class="avatar">
            </div>
            
            <!-- 姓名與職業 -->
            <h1 class="name">林晨曦</h1>
            <p class="tagline">UI/UX Designer & 視覺創作者</p>
            
            <!-- 簡短自我介紹 -->
            <p class="bio">
                熱愛將複雜的問題轉化為簡單、美觀的視覺介面。專注於使用者體驗與網頁視覺設計。
            </p>

            <!-- 數據/統計區塊 (增添質感) -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number">3+</span>
                    <span class="stat-label">設計年資</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">25+</span>
                    <span class="stat-label">完成專案</span>
                </div>
            </div>

            <!-- 社群平台連結按鈕 -->
            <div class="social-links">
                <a href="#" class="social-icon" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon" title="Behance"><i class="fab fa-behance"></i></a>
                <a href="#" class="social-icon" title="Dribbble"><i class="fab fa-dribbble"></i></a>
                <a href="#" class="social-icon" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>

            <!-- 行動呼籲按鈕 (Call to Action) -->
            <div class="action-buttons">
                <a href="mailto:yourname@email.com" class="btn btn-primary">與我聯繫</a>
                <a href="#" class="btn btn-secondary">下載履歷</a>
            </div>
        </div>
    </div>

</body>
</html>
